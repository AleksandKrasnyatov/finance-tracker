name: build-images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Additional image tag (also always pushes git SHA)"
        required: true
        default: testing
        type: string

concurrency:
  group: build-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set registry (lowercase)
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "REGISTRY=ghcr.io/${owner}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: make build

      - name: Push SHA tags
        run: make push

      - name: Push extra tag
        env:
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          for name in finance-tracker-nginx finance-tracker-php-fpm finance-tracker-php-cli; do
            docker tag "${REGISTRY}/${name}:${IMAGE_TAG}" "${REGISTRY}/${name}:${EXTRA_TAG}"
            docker push "${REGISTRY}/${name}:${EXTRA_TAG}"
          done
