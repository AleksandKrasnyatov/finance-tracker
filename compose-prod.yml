services:
  nginx:
    image: ${REGISTRY}/finance-tracker-nginx:${IMAGE_TAG}
    ports:
      # Prod behind host nginx+certbot: APP_BIND=127.0.0.1 APP_PORT=8080
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    image: ${REGISTRY}/finance-tracker-php-fpm:${IMAGE_TAG}
    env_file:
      - .env
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  php-cli:
    image: ${REGISTRY}/finance-tracker-php-cli:${IMAGE_TAG}
    env_file:
      - .env
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - tools

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_prod:/data
    restart: unless-stopped

volumes:
  postgres_prod:
  redis_prod:
